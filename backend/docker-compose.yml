services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: charity
      POSTGRES_PASSWORD: charity
      POSTGRES_DB: charity_finder
    ports:
      # Host 5433 -> container 5432: avoids clashing with a native Postgres
      # already running on the host's default 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
