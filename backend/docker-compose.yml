services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: charity
      POSTGRES_PASSWORD: charity
      POSTGRES_DB: charity_finder
    ports:
      # 5433 avoids clashing with a native Postgres already on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    env_file: .env
    environment:
      # .env's DATABASE_URL targets localhost:5433 for host-mode `uvicorn --reload`
      # (reaching db's published port). From inside this container, localhost is
      # the container itself, so it must use the db service's name and internal port.
      DATABASE_URL: postgresql+psycopg2://charity:charity@db:5432/charity_finder
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
